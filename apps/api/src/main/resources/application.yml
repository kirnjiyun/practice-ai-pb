spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aipb}
    username: ${DB_USER:aipb}
    password: ${DB_PASSWORD:aipb}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
auth:
  secret: ${JWT_SECRET}
  access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
  refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo-seed: ${DEMO_SEED_ENABLED:false}
