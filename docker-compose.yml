# =============================================================================
# AI PB — 로컬 개발 환경
#
#   인프라만 기동      : docker compose up -d
#   앱까지 전체 기동    : docker compose --profile app up -d --build
#
# apps/api, apps/web 코드가 아직 없는 W1 단계에서는 인프라만 기동한다.
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aipb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aipb}
      POSTGRES_USER: ${POSTGRES_USER:-aipb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aipb}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aipb} -d ${POSTGRES_DB:-aipb}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aipb-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: aipb-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aipb-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aipb-minio-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # 최초 1회 버킷 생성 후 종료되는 일회성 잡
  minio-init:
    image: minio/mc:latest
    container_name: aipb-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-aipb-minio} ${MINIO_ROOT_PASSWORD:-aipb-minio-secret} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-aipb-documents} &&
      mc anonymous set none local/${MINIO_BUCKET:-aipb-documents} &&
      echo 'minio bucket ready';
      "
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: aipb-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/aipb}
      DB_USER: ${POSTGRES_USER:-aipb}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aipb}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-aipb-documents}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-aipb-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aipb-minio-secret}
      JWT_SECRET: ${JWT_SECRET}
      AES_KEY: ${AES_KEY}
      HMAC_KEY: ${HMAC_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-stub}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      PROMPT_VERSION: ${PROMPT_VERSION:-v1}
      POLICY_VERSION: ${POLICY_VERSION:-v1}
      RULE_VERSION: ${RULE_VERSION:-v1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: aipb-web
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-5173}:5173"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
